<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Aluno - Anatomia Vegetal</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<header class="cabecalho">
    <div class="container">
        <h1>🎓 Área do Aluno</h1>

        <nav>
            <a th:href="@{/}">Início</a>
            <a th:href="@{/raizes}">Raízes</a>
            <a th:href="@{/caules}">Caules</a>
            <a th:href="@{/folhas}">Folhas</a>
        </nav>
    </div>
</header>

<main class="container">

    <section class="login-area">

        <h2>Entrar</h2>

        <p>
            Digite seu e-mail e senha para acessar
            o quiz de Anatomia Vegetal.
        </p>

        <p class="erro"
           th:if="${erro}"
           th:text="${erro}">
        </p>

        <form th:action="@{/login}" method="post">

            <label for="email">E-mail</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
                required>

            <label for="senha">Senha</label>

            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Digite sua senha"
                required>

            <button class="botao" type="submit">
                Entrar
            </button>

        </form>

        <div class="dados-demo">

            <p><strong>Login para apresentação:</strong></p>

            <p>
                E-mail: <strong>aluno@escola.com</strong>
            </p>

            <p>
                Senha: <strong>123456</strong>
            </p>

        </div>

    </section>

</main>

<footer class="rodape">
    <div class="container">
        <p>🌱 Projeto escolar — Anatomia Vegetal</p>
    </div>
</footer>

</body>
</html>
